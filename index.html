<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style-principal-geral.css">
    <link rel="stylesheet" href="estilos/style-versoes.css">
    <link rel="shortcut icon" href="imagens/favicon/favicon-16x16.png" type="image/x-icon">
    <title>Login</title>
</head>
<body>
    <main>
        <section id="container-principal">
            <section id="container-imagem"></section>

            <h1>Frota360</h1>

            <form id="login-form" method="post" autocomplete="on">
                <section class="caixa">
                    <label for="email">
                        <span class="material-symbols-outlined">person</span>
                    </label>
                    <input class="caixa-texto" type="email" name="email" id="email" placeholder="Digite seu e-mail" autocomplete="email">
                </section>

                <section class="caixa">
                    <label for="senha">
                        <span class="material-symbols-outlined">vpn_key</span>
                    </label>
                    <input class="caixa-texto" type="password" name="senha" id="senha" placeholder="Digite sua senha" minlength="8" max="15" autocomplete="current-password">
                </section>

                <section>
                    <input id="btn-logar" type="submit" value="Logar">
                </section>

                <section>
                    <input id="btn-esqueci-senha" type="button" value="Esqueci a senha">
                </section>

                <section>
                    <p><a href="cadastro.html">Criar conta</a></p>
                </section>
            </form>
        </section>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-auth.js"></script>

    <script type="module">
        // Importando as funções necessárias do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAJkUFdj1FTlbreV19MEQeZ6XHqnM9uir4",
            authDomain: "controle-de-frotas-a476b.firebaseapp.com",
            projectId: "controle-de-frotas-a476b",
            storageBucket: "controle-de-frotas-a476b.firebasestorage.app",
            messagingSenderId: "382107444959",
            appId: "1:382107444959:web:ec5df2c463fc594a9b2b6a",
            measurementId: "G-PGT5F88FC0"
        };

        // Inicializando o Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Capturando o evento de envio do formulário
        document.getElementById("login-form").addEventListener("submit", function(event) {
            event.preventDefault(); // Impede o envio do formulário tradicional

            // Captura os valores de e-mail e senha
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            // Tenta realizar o login com Firebase
            signInWithEmailAndPassword(auth, email, senha)
                .then((userCredential) => {
                    // Login bem-sucedido, redireciona para a página de registro de KM
                    console.log("Usuário autenticado:", userCredential.user);
                    window.location.href = 'registro-kms.html'; // Redireciona para o registro de KM
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Erro ao autenticar:", errorCode, errorMessage);
                    alert("Erro ao realizar login. Verifique suas credenciais.");
                });
        });
    </script>
</body>
</html>
